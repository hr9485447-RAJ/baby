<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special 💖</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#ff4e8a,#ff9a9e,#fad0c4,#fbc2eb);
    background-size:400% 400%;
    animation: gradient 10s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    animation: float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

h1{
    color:#ff2e63;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#ff2e63;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#ff4e8a;
}
</style>
</head>

<body>

<div class="card">
    <h1>meli sona ji  🌸</h1>
    <p>melo ko kissi chahiye </p>
    <p>💕</p>
    <button onclick="showMessage()">yes </button>
</div>

<script>
function showMessage(){
    alert("You are amazing! 😊");
}
</script>

</body>
</html>
